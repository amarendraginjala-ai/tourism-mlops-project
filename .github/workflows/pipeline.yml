
# ---------------------------------------------------------
# Tourism Package Purchase Prediction - MLOps Pipeline
# ---------------------------------------------------------

name: Tourism MLOps Pipeline


# ---------------------------------------------------------
# Workflow Trigger
# ---------------------------------------------------------

# Run the pipeline whenever changes are pushed to the main branch
on:
  push:
    branches:
      - main

  # Allow the workflow to be started manually from GitHub
  workflow_dispatch:


# ---------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------

env:
  # Hugging Face dataset repository
  HF_DATASET_REPO: Amarendraa/Tourism

  # Hugging Face model repository
  HF_MODEL_REPO: Amarendraa/Tourism-Package-Purchase-RandomForest


# ---------------------------------------------------------
# Job 1: Dataset Registration
# ---------------------------------------------------------

jobs:

  register-dataset:

    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the libraries required by the workflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      # Upload the original dataset to Hugging Face
      - name: Register dataset on Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |

          python - <<'PY'

          import os
          from huggingface_hub import HfApi

          # Create Hugging Face API client
          api = HfApi(
              token=os.environ["HF_TOKEN"]
          )

          # Upload the original tourism dataset
          api.upload_file(
              path_or_fileobj="data/tourism.csv",
              path_in_repo="tourism.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset"
          )

          print("Original tourism dataset registered successfully.")

          PY


  # -------------------------------------------------------
  # Job 2: Data Preparation
  # -------------------------------------------------------

  data-prep:

    needs: register-dataset
    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      # Prepare and upload the datasets
      - name: Prepare and upload dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |

          python - <<'PY'

          import os
          import pandas as pd

          from datasets import load_dataset
          from sklearn.model_selection import train_test_split
          from huggingface_hub import HfApi


          # -------------------------------------------------
          # Load the original dataset from Hugging Face
          # -------------------------------------------------

          dataset_url = (
              "https://huggingface.co/datasets/"
              + os.environ["HF_DATASET_REPO"]
              + "/resolve/main/tourism.csv"
          )

          dataset = load_dataset(
              "csv",
              data_files=dataset_url,
              split="train"
          )

          df = dataset.to_pandas()


          # -------------------------------------------------
          # Remove unnecessary columns
          # -------------------------------------------------

          df = df.drop(
              columns=[
                  "Unnamed: 0",
                  "CustomerID"
              ],
              errors="ignore"
          )


          # -------------------------------------------------
          # Standardize gender values
          # -------------------------------------------------

          df["Gender"] = df["Gender"].replace(
              {
                  "Fe Male": "Female"
              }
          )


          # -------------------------------------------------
          # Encode binary categorical variables
          # -------------------------------------------------

          df["TypeofContact"] = df["TypeofContact"].map(
              {
                  "Self Enquiry": 0,
                  "Company Invited": 1
              }
          )

          df["Gender"] = df["Gender"].map(
              {
                  "Female": 0,
                  "Male": 1
              }
          )


          # -------------------------------------------------
          # One-hot encode categorical variables
          # -------------------------------------------------

          df = pd.get_dummies(
              df,
              columns=[
                  "Occupation",
                  "ProductPitched",
                  "MaritalStatus",
                  "Designation"
              ],
              drop_first=True,
              dtype=int
          )


          # -------------------------------------------------
          # Separate predictors and target
          # -------------------------------------------------

          X = df.drop(
              columns=["ProdTaken"]
          )

          y = df["ProdTaken"]


          # -------------------------------------------------
          # Create stratified train-test split
          # -------------------------------------------------

          X_train, X_test, y_train, y_test = train_test_split(
              X,
              y,
              test_size=0.20,
              random_state=42,
              stratify=y
          )


          # -------------------------------------------------
          # Create train and test datasets
          # -------------------------------------------------

          train_df = X_train.copy()
          train_df["ProdTaken"] = y_train

          test_df = X_test.copy()
          test_df["ProdTaken"] = y_test


          # -------------------------------------------------
          # Save prepared datasets locally
          # -------------------------------------------------

          train_df.to_csv(
              "data/train.csv",
              index=False
          )

          test_df.to_csv(
              "data/test.csv",
              index=False
          )


          # -------------------------------------------------
          # Upload prepared datasets to Hugging Face
          # -------------------------------------------------

          api = HfApi(
              token=os.environ["HF_TOKEN"]
          )

          api.upload_file(
              path_or_fileobj="data/train.csv",
              path_in_repo="train.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset"
          )

          api.upload_file(
              path_or_fileobj="data/test.csv",
              path_in_repo="test.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset"
          )


          print("Data preparation completed successfully.")
          print(f"Training data shape: {train_df.shape}")
          print(f"Testing data shape: {test_df.shape}")

          PY


  # -------------------------------------------------------
  # Job 3: Model Training
  # -------------------------------------------------------

  model-training:

    needs: data-prep
    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      # Train and register the final Random Forest model
      - name: Train and register Random Forest model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |

          python - <<'PY'

          import os
          import pandas as pd
          import joblib

          from huggingface_hub import hf_hub_download
          from huggingface_hub import HfApi

          from sklearn.ensemble import RandomForestClassifier

          from sklearn.metrics import (
              accuracy_score,
              precision_score,
              recall_score,
              f1_score,
              roc_auc_score
          )


          # -------------------------------------------------
          # Load train and test datasets directly from HF
          # -------------------------------------------------

          train_path = hf_hub_download(
              repo_id=os.environ["HF_DATASET_REPO"],
              filename="train.csv",
              repo_type="dataset"
          )

          test_path = hf_hub_download(
              repo_id=os.environ["HF_DATASET_REPO"],
              filename="test.csv",
              repo_type="dataset"
          )


          train_df = pd.read_csv(
              train_path
          )

          test_df = pd.read_csv(
              test_path
          )


          # -------------------------------------------------
          # Separate predictors and target
          # -------------------------------------------------

          X_train = train_df.drop(
              columns=["ProdTaken"]
          )

          y_train = train_df["ProdTaken"]

          X_test = test_df.drop(
              columns=["ProdTaken"]
          )

          y_test = test_df["ProdTaken"]


          # -------------------------------------------------
          # Define the final Random Forest model
          # -------------------------------------------------

          model = RandomForestClassifier(
              n_estimators=200,
              max_depth=None,
              min_samples_split=2,
              min_samples_leaf=1,
              random_state=42,
              class_weight="balanced"
          )


          # Train the model
          model.fit(
              X_train,
              y_train
          )


          # -------------------------------------------------
          # Generate predictions
          # -------------------------------------------------

          predictions = model.predict(
              X_test
          )

          probabilities = model.predict_proba(
              X_test
          )[:, 1]


          # -------------------------------------------------
          # Calculate evaluation metrics
          # -------------------------------------------------

          accuracy = accuracy_score(
              y_test,
              predictions
          )

          precision = precision_score(
              y_test,
              predictions,
              zero_division=0
          )

          recall = recall_score(
              y_test,
              predictions,
              zero_division=0
          )

          f1 = f1_score(
              y_test,
              predictions,
              zero_division=0
          )

          roc_auc = roc_auc_score(
              y_test,
              probabilities
          )


          # -------------------------------------------------
          # Display model evaluation results
          # -------------------------------------------------

          print("Random Forest model evaluation:")
          print(f"Accuracy : {accuracy:.4f}")
          print(f"Precision: {precision:.4f}")
          print(f"Recall   : {recall:.4f}")
          print(f"F1 Score : {f1:.4f}")
          print(f"ROC-AUC  : {roc_auc:.4f}")


          # -------------------------------------------------
          # Save trained model
          # -------------------------------------------------

          model_path = (
              "model_building/"
              "random_forest_tourism_model.joblib"
          )

          joblib.dump(
              model,
              model_path
          )


          # -------------------------------------------------
          # Register model on Hugging Face Model Hub
          # -------------------------------------------------

          api = HfApi(
              token=os.environ["HF_TOKEN"]
          )

          api.upload_file(
              path_or_fileobj=model_path,
              path_in_repo="random_forest_tourism_model.joblib",
              repo_id=os.environ["HF_MODEL_REPO"],
              repo_type="model"
          )


          print(
              "Random Forest model registered successfully."
          )

          PY


  # -------------------------------------------------------
  # Job 4: Deployment Validation
  # -------------------------------------------------------

  deploy-hosting:

    needs: model-training
    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify that all deployment files exist
      - name: Validate deployment files
        run: |

          test -f deployment/app.py
          test -f deployment/requirements.txt
          test -f deployment/Dockerfile

          echo "All deployment files are present."
          echo "Streamlit deployment is ready for hosting."
