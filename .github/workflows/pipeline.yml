
# ---------------------------------------------------------
# Tourism Package Purchase Prediction - MLOps Pipeline
# ---------------------------------------------------------

name: Tourism MLOps Pipeline


# ---------------------------------------------------------
# Workflow Trigger
# ---------------------------------------------------------

# Run the pipeline whenever changes are pushed to the main branch
on:
  push:
    branches:
      - main

  # Also allow the workflow to be started manually from GitHub
  workflow_dispatch:


# ---------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------

env:

  # Hugging Face dataset repository
  HF_DATASET_REPO: Amarendraa/Tourism

  # Hugging Face model repository
  HF_MODEL_REPO: Amarendraa/Tourism-Package-Purchase-RandomForest


# ---------------------------------------------------------
# Job 1: Dataset Registration
# ---------------------------------------------------------

jobs:

  register-dataset:

    # Use an Ubuntu virtual machine provided by GitHub Actions
    runs-on: ubuntu-latest

    steps:

      # Download the project files from the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Install the packages required by the workflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/.github/workflows/requirements.txt


      # Register the original tourism dataset on Hugging Face
      - name: Register dataset on Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          # Create the Hugging Face API client
          api = HfApi(token=os.environ["HF_TOKEN"])

          # Upload the original tourism dataset to the dataset repository
          api.upload_file(
              path_or_fileobj="tourism_project/data/tourism.csv",
              path_in_repo="tourism.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset"
          )

          print("Original tourism dataset registered successfully.")
          PY


  # -------------------------------------------------------
  # Job 2: Data Preparation
  # -------------------------------------------------------

  data-prep:

    # Run data preparation after dataset registration
    needs: register-dataset

    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/.github/workflows/requirements.txt


      # Prepare the dataset and upload train/test data to Hugging Face
      - name: Prepare and upload dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from datasets import load_dataset
          from sklearn.model_selection import train_test_split
          from huggingface_hub import HfApi

          # Define the Hugging Face dataset URL
          dataset_url = (
              "https://huggingface.co/datasets/"
              + os.environ["HF_DATASET_REPO"]
              + "/resolve/main/tourism.csv"
          )

          # Load the tourism dataset directly from Hugging Face
          dataset = load_dataset(
              "csv",
              data_files=dataset_url,
              split="train"
          )

          df = dataset.to_pandas()

          # Remove unnecessary identifier columns
          df = df.drop(
              columns=["Unnamed: 0", "CustomerID"],
              errors="ignore"
          )

          # Standardize gender values
          df["Gender"] = df["Gender"].replace(
              {"Fe Male": "Female"}
          )

          # Encode binary categorical variables
          df["TypeofContact"] = df["TypeofContact"].map({
              "Self Enquiry": 0,
              "Company Invited": 1
          })

          df["Gender"] = df["Gender"].map({
              "Female": 0,
              "Male": 1
          })

          # Create one-hot encoded variables using the same
          # preprocessing structure used during model development
          df = pd.get_dummies(
              df,
              columns=[
                  "Occupation",
                  "ProductPitched",
                  "MaritalStatus",
                  "Designation"
              ],
              drop_first=True,
              dtype=int
          )

          # Separate predictors and target
          X = df.drop(columns=["ProdTaken"])
          y = df["ProdTaken"]

          # Perform the same stratified 80/20 split used during development
          X_train, X_test, y_train, y_test = train_test_split(
              X,
              y,
              test_size=0.20,
              random_state=42,
              stratify=y
          )

          # Reconstruct train and test datasets
          train_df = X_train.copy()
          train_df["ProdTaken"] = y_train

          test_df = X_test.copy()
          test_df["ProdTaken"] = y_test

          # Save prepared datasets locally in the project
          train_df.to_csv(
              "tourism_project/data/train.csv",
              index=False
          )

          test_df.to_csv(
              "tourism_project/data/test.csv",
              index=False
          )

          # Upload the prepared datasets to Hugging Face
          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj="tourism_project/data/train.csv",
              path_in_repo="train.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset"
          )

          api.upload_file(
              path_or_fileobj="tourism_project/data/test.csv",
              path_in_repo="test.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset"
          )

          print("Data preparation completed successfully.")
          print(f"Training data shape: {train_df.shape}")
          print(f"Testing data shape: {test_df.shape}")
          PY


  # -------------------------------------------------------
  # Job 3: Model Training
  # -------------------------------------------------------

  model-training:

    # Run model training after data preparation
    needs: data-prep

    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Install required packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/.github/workflows/requirements.txt


      # Train the Random Forest model and upload it to Hugging Face
      - name: Train and register Random Forest model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          import joblib
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import (
              accuracy_score,
              precision_score,
              recall_score,
              f1_score,
              roc_auc_score
          )
          from huggingface_hub import HfApi

          # Load the prepared training and testing datasets
          train_df = pd.read_csv(
              "tourism_project/data/train.csv"
          )

          test_df = pd.read_csv(
              "tourism_project/data/test.csv"
          )

          # Separate predictors and target variable
          X_train = train_df.drop(columns=["ProdTaken"])
          y_train = train_df["ProdTaken"]

          X_test = test_df.drop(columns=["ProdTaken"])
          y_test = test_df["ProdTaken"]

          # Define the final Random Forest model using
          # the selected hyperparameters from model development
          model = RandomForestClassifier(
              n_estimators=200,
              max_depth=None,
              min_samples_split=2,
              min_samples_leaf=1,
              random_state=42,
              class_weight="balanced"
          )

          # Train the model
          model.fit(X_train, y_train)

          # Generate predictions on the test dataset
          predictions = model.predict(X_test)

          # Generate purchase probabilities
          probabilities = model.predict_proba(X_test)[:, 1]

          # Calculate evaluation metrics
          accuracy = accuracy_score(y_test, predictions)
          precision = precision_score(
              y_test,
              predictions,
              zero_division=0
          )
          recall = recall_score(
              y_test,
              predictions,
              zero_division=0
          )
          f1 = f1_score(
              y_test,
              predictions,
              zero_division=0
          )
          roc_auc = roc_auc_score(
              y_test,
              probabilities
          )

          # Display model evaluation results in GitHub Actions
          print("Random Forest model evaluation:")
          print(f"Accuracy : {accuracy:.4f}")
          print(f"Precision: {precision:.4f}")
          print(f"Recall   : {recall:.4f}")
          print(f"F1 Score : {f1:.4f}")
          print(f"ROC-AUC  : {roc_auc:.4f}")

          # Save the trained model
          model_path = (
              "tourism_project/model_building/"
              "random_forest_tourism_model.joblib"
          )

          joblib.dump(model, model_path)

          # Upload the trained model to Hugging Face Model Hub
          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj=model_path,
              path_in_repo="random_forest_tourism_model.joblib",
              repo_id=os.environ["HF_MODEL_REPO"],
              repo_type="model"
          )

          print("Random Forest model registered successfully.")
          PY


  # -------------------------------------------------------
  # Job 4: Deployment Validation
  # -------------------------------------------------------

  deploy-hosting:

    # Run after successful model training
    needs: model-training

    runs-on: ubuntu-latest

    steps:

      # Download the project repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Validate that the Streamlit deployment files exist
      - name: Validate deployment files
        run: |
          test -f tourism_project/deployment/app.py
          test -f tourism_project/deployment/requirements.txt
          test -f tourism_project/deployment/Dockerfile

          echo "All deployment files are present."
          echo "Streamlit deployment is ready for hosting through Streamlit Community Cloud."
